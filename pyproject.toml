[project]
name = "rooftopsenti"
version = "0.1.0"
description = "Large-scale rooftop solar detection from Sentinel-2 — OSM training labels, GlobalBuildingAtlas ROIs, STAC-native pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tobias Augspurger" }]
dependencies = [
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio",
    "pyarrow",
    "rioxarray",
    "xarray",
    "dask",
    "mgrs",
    "pystac>=1.10",
    "pystac-client>=0.8",
    "odc-stac",
    "s2mosaic",
    "torchgeo>=0.6",
    "segmentation-models-pytorch",
    "lightning",
    "httpx",
    "h5py>=3.11",
    "duckdb",
    "typer",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "loguru",
    "tqdm",
    "folium",
]

[project.scripts]
rooftopsenti = "rooftopsenti.cli:app"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rooftopsenti"]

# ---------------------------------------------------------------- pixi ----

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
# keep ~/.local site-packages from leaking into the env
PYTHONNOUSERSITE = "1"

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
# geo stack (conda-forge resolves GDAL/PROJ far better than wheels)
gdal = "*"
rasterio = ">=1.3"
geopandas = ">=1.0"
shapely = ">=2.0"
pyproj = ">=3.6"
pyogrio = "*"
pyarrow = "*"
rioxarray = "*"
xarray = "*"
# odc-loader needs dask.typing.Key; an unconstrained solve once downgraded
# dask to 2023.3.0 to satisfy the cuda stack and broke the composite stage
dask = ">=2025"
mgrs = "*"
# STAC
pystac = ">=1.10"
pystac-client = ">=0.8"
odc-stac = "*"
# ML
pytorch = ">=2.2"
torchvision = "*"
torchgeo = ">=0.6"
segmentation-models-pytorch = "*"
lightning = "*"
timm = "*"
# data access / misc
httpx = "*"
h5py = ">=3.11"
python-duckdb = "*"
typer = "*"
pydantic = ">=2"
pydantic-settings = "*"
pyyaml = "*"
loguru = "*"
tqdm = "*"
folium = "*"
# dev
pytest = "*"
ruff = "*"
planetary-computer = ">=1.0.0,<2"

[tool.pixi.pypi-dependencies]
rooftopsenti = { path = ".", editable = true }
s2mosaic = "*"
omnicloudmask = "*"

# Opt-in CUDA environment: `pixi run -e cuda ...` on a machine with NVIDIA driver
[tool.pixi.feature.cuda.system-requirements]
cuda = "12"

[tool.pixi.feature.cuda.dependencies]
# without this the solver happily picks the cpu_mkl pytorch build and the
# "cuda" env silently trains on CPU; cuda-version is capped at 12.6 because
# later builds drop Pascal (sm_61, GTX 10xx) kernels
pytorch-gpu = "*"
cuda-version = "12.6.*"

[tool.pixi.environments]
default = { solve-group = "default" }
cuda = { features = ["cuda"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check src tests"
fmt = "ruff format src tests"
smoke = "rooftopsenti run-all -c configs/smoke_nl_tile.yaml"

# ---------------------------------------------------------------- tools ---

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
