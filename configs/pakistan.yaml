# Transfer target (M4): inference-only — model trained on well-mapped regions (NL/DE).
# OSM solar coverage is sparse here, so detections are *candidates* requiring review.
region: pakistan

aoi:
  source: geoboundaries
  iso3: PAK
  admin_level: 1
  admin_name: Punjab          # run province-by-province; country-scale is large

overture:
  release: "2026-05-20.0"

osm:
  source: overture           # overture (default, no rate limits) | overpass (live OSM)
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 1000
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 1.0
  timeout_s: 300

imagery:
  stac_source: earthgenome           # global yearly mosaics; bands must match the NL-trained model
  collection: sentinel2-temporal-mosaics
  date_ranges:
    - ["2023-10-01", "2024-03-31"]   # intersects the 2023 yearly mosaic (mosaics are full-year)
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

gba:
  source: huggingface        # huggingface (GlobalBuildingAtlas) | overture
  building_area_min_m2: 1000

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4
  neg_ratio: 5

postprocess:
  prob_threshold: 0.4         # lower threshold + manual review in transfer regions
  building_coverage_min: 0.10
  min_solar_area_m2: 1000

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
