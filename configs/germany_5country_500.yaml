# TRAINING config (>=500 m2): Germany (primary) + Switzerland + Netherlands +
# United Kingdom + New Zealand + Pakistan.
#
# Germany is the primary region: it contributes its own chips AND is the only
# region used for the held-out test metrics. The other four are merged into
# train/val via model.train_regions (each keeps its own spatial-block split, so
# train/val/test stay geographically disjoint per region). All five share the
# same bands and >=500 m2 thresholds, so their chips are channel-compatible.
#
# This config shares region germany_500 (-> data/germany_500/) with
# configs/germany_500.yaml; that file builds Germany's chips, this one trains.
#
# Run order (or use scripts/train_5country_500.sh):
#   # 1. build chips for every region first (train_regions are a hard dependency)
#   pixi run rooftopsenti chips -c configs/germany_500.yaml
#   pixi run rooftopsenti chips -c configs/switzerland_500.yaml
#   pixi run rooftopsenti chips -c configs/netherlands_500.yaml
#   pixi run rooftopsenti chips -c configs/united_kingdom_500.yaml
#   pixi run rooftopsenti chips -c configs/new_zealand_500.yaml
#   # 2. train the pooled model (GPU: pixi run -e cuda ...)
#   pixi run rooftopsenti train -c configs/germany_5country_500.yaml
#
# Trained checkpoint: data/germany_500/models/<run_id>/best.ckpt
# (<run_id> is the short hash printed as "run id ..." by every command).
region: germany_500

aoi:
  source: geoboundaries
  iso3: DEU
  admin_level: 0
  admin_name: null

overture:
  release: "2026-05-20.0"

osm:
  source: overture           # no rate limits — preferred for training labels
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 500     # >=500 m2 rooftop solar arrays count as positives
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 0.5
  timeout_s: 300

imagery:
  stac_source: earthgenome
  collection: sentinel2-temporal-mosaics
  date_ranges:
    - ["2023-04-01", "2023-09-30"]
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 500

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  # CH/NL/UK/NZ/PK chips merged into train/val; Germany-only held-out test metrics
  train_regions: [switzerland_500, netherlands_500, united_kingdom_500, new_zealand_500, pakistan_500]
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4
  neg_ratio: 1

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10
  min_solar_area_m2: 500

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
