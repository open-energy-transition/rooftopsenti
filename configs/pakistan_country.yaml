# M4 transfer — WHOLE of Pakistan (141 MGRS tiles). Inference-only with the
# NL-trained model. OSM solar is sparse here, so detections are *candidates*
# requiring manual review. Composites are the bottleneck (~15-20 h at a slow
# link); inference itself is ~1-2 h.
#
#   rooftopsenti aoi        -c configs/pakistan_country.yaml
#   rooftopsenti composite  -c configs/pakistan_country.yaml
#   rooftopsenti buildings        -c configs/pakistan_country.yaml
#   rooftopsenti labels     -c configs/pakistan_country.yaml      # fresh OSM solar for the audit
#   rooftopsenti infer      -c configs/pakistan_country.yaml \
#       --model-ckpt data/netherlands/models/8af0b2fbff/best.ckpt
#   rooftopsenti postprocess -c configs/pakistan_country.yaml
#   rooftopsenti report      -c configs/pakistan_country.yaml
region: pakistan_country

aoi:
  source: geoboundaries
  iso3: PAK
  admin_level: 0             # whole country
  admin_name: null

overture:
  release: "2026-05-20.0"

osm:
  source: overpass           # live OSM for the missing-in-OSM audit (freshest existing solar)
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 1000
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 1.0
  timeout_s: 300

imagery:
  stac_source: earthgenome
  collection: sentinel2-temporal-mosaics
  date_ranges:
    - ["2023-02-01", "2023-12-31"]   # the 2023 yearly mosaic (single period, like NL)
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 1000

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4
  neg_ratio: 1

postprocess:
  prob_threshold: 0.4          # lower threshold + manual review in transfer regions
  building_coverage_min: 0.10
  min_solar_area_m2: 1000

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
