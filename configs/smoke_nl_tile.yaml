# M1 smoke test: tiny bbox around Venlo (NL) — dense large-roof logistics area with
# OSM-mapped rooftop solar. One MGRS tile, short date range, CPU-friendly settings.
region: smoke_nl_tile

aoi:
  source: bbox
  bbox: [6.10, 51.30, 6.25, 51.45]   # W, S, E, N (Venlo logistics corridor)

overture:
  release: "2026-05-20.0"

osm:
  source: overture           # overture (default, no rate limits) | overpass (live OSM)
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 1000
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 0.5
  timeout_s: 180

imagery:
  stac_source: earthgenome          # pre-composited yearly mosaics; public, no auth
  collection: sentinel2-temporal-mosaics
  date_ranges:
    - ["2023-06-01", "2023-07-31"]  # intersects the 2023 yearly mosaic
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 1000

model:
  arch: unet
  encoder: resnet18
  pretrained: null            # smoke: random init, 2 epochs, just prove the plumbing
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-3
  batch_size: 4
  patch_size: 256
  max_epochs: 2
  device: auto

chips:
  pos_per_label: 2
  neg_ratio: 1

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10
  min_solar_area_m2: 1000

split:
  block_size_km: 5            # tiny AOI -> small blocks so all splits are populated
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
