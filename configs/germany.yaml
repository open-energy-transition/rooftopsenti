# Training-label region (M2+): Germany has the densest OSM mapping of large
# rooftop solar in Europe — several thousand polygons vs ~700 in NL. Used to
# enlarge the training set; chips from multiple regions can be combined.
#
# Country-scale Germany spans ~110 MGRS tiles. To start smaller, restrict to a
# Bundesland with dense industrial rooftop PV, e.g.:
#   admin_level: 1
#   admin_name: Bayern          # or Nordrhein-Westfalen, Baden-Württemberg
region: germany

aoi:
  source: geoboundaries
  iso3: DEU
  admin_level: 0
  admin_name: null

overture:
  release: "2026-06-17.0"

osm:
  source: overture           # overture (default, no rate limits) | overpass (live OSM)
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 1000    # ~10 Sentinel-2 pixels
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 0.5
  timeout_s: 300

imagery:
  stac_source: planetary_computer   # same source/bands as NL so chips are compatible
  collection: sentinel-2-l2a
  date_ranges:
    - ["2025-04-01", "2025-09-30"]   # scene search window
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 1000

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4
  neg_ratio: 1

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10
  min_solar_area_m2: 1000

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
