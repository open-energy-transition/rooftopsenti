# TRAINING config (>=500 m2): Netherlands (primary) + Germany.
#
# The primary region (netherlands_500) contributes its own chips AND is the only
# region used for the held-out test metrics. Germany chips are merged into
# train/val via model.train_regions. Both regions use the same bands and the same
# >=500 m2 thresholds so their chips are compatible.
#
# WINDOWS quickstart (PowerShell or cmd; pixi handles the env):
#
#   pixi install
#   :: 1. build Germany chips first (train_regions dependency)
#   pixi run rooftopsenti chips   -c configs/germany_500.yaml
#   :: 2. train on NL+DE (run-all also self-infers on NL — harmless; or stop after train)
#   pixi run rooftopsenti run-all -c configs/nl_de_500.yaml
#   :: with an NVIDIA GPU use the cuda env instead:
#   :: pixi run -e cuda rooftopsenti run-all -c configs/nl_de_500.yaml
#
# The trained checkpoint lands at:
#   data/netherlands_500/models/<run_id>/best.ckpt
# (<run_id> is the short hash printed as "run id ..." by every command). Feed that
# path to configs/pakistan_500.yaml for transfer inference.
region: netherlands_500

aoi:
  source: geoboundaries
  iso3: NLD
  admin_level: 0
  admin_name: null

overture:
  release: "2026-06-17.0"

osm:
  source: overture           # no rate limits — preferred for training labels
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 500     # >=500 m2 solar polygons count as positives
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 0.5
  timeout_s: 300

imagery:
  stac_source: planetary_computer
  collection: sentinel-2-l2a
  date_ranges:
    - ["2025-04-01", "2025-09-30"]
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 500  # >=500 m2 buildings

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  train_regions: [germany_500]   # DE chips merged into train/val; NL-only test
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4
  neg_ratio: 1

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10
  min_solar_area_m2: 500

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
