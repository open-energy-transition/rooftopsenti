# INFERENCE config (>=500 m2): whole of Pakistan, transfer inference with the
# model trained on NL+DE (configs/nl_de_500.yaml). OSM solar is sparse here, so
# every detection is a CANDIDATE for manual review — which is the point: thresholds
# are set permissively (more false positives) since hits are later validated against
# high-resolution imagery before mapping into OpenStreetMap.
#
# No training happens here. After nl_de_500 has produced a checkpoint:
#
# WINDOWS (PowerShell/cmd):
#   pixi run rooftopsenti aoi        -c configs/pakistan_500.yaml
#   pixi run rooftopsenti composite  -c configs/pakistan_500.yaml --resume
#   pixi run rooftopsenti buildings        -c configs/pakistan_500.yaml
#   pixi run rooftopsenti labels     -c configs/pakistan_500.yaml      :: fresh OSM solar for the audit
#   pixi run rooftopsenti infer      -c configs/pakistan_500.yaml --resume ^
#       --model-ckpt data/netherlands_500/models/<run_id>/best.ckpt
#   pixi run rooftopsenti postprocess -c configs/pakistan_500.yaml
#   pixi run rooftopsenti report      -c configs/pakistan_500.yaml
#
# (^ is the cmd line-continuation; in PowerShell use a backtick ` instead.)
# Composites are the bottleneck (~15-20 h on a slow link); inference is ~1-2 h.
region: pakistan_500

aoi:
  source: geoboundaries
  iso3: PAK
  admin_level: 0             # whole country
  admin_name: null

overture:
  release: "2026-05-20.0"

osm:
  source: overpass           # live OSM for the missing-in-OSM audit (freshest existing solar)
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 500
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 1.0
  timeout_s: 300

imagery:
  stac_source: earthgenome   # MUST match the training bands for the checkpoint to load
  collection: sentinel2-temporal-mosaics
  date_ranges:
    - ["2023-02-01", "2023-12-31"]   # the 2023 yearly mosaic
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 500  # >=500 m2 buildings define the inference ROIs

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 2
  neg_ratio: 0.5

postprocess:
  prob_threshold: 0.35         # permissive: favour recall, accept more false positives
  building_coverage_min: 0.05  # a small predicted-solar fraction flags the building
  min_solar_area_m2: 500

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
