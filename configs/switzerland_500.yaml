# Chip-source region for the ">=500 m2" multi-country run — Switzerland.
# Pooled into train/val of configs/germany_5country_500.yaml via model.train_regions.
# Build its chips first (aoi -> labels -> composite -> buildings -> chips):
#
#   pixi run rooftopsenti chips -c configs/switzerland_500.yaml
#
# Bands/thresholds match the other *_500 configs so chips are channel-compatible.
region: switzerland_500

aoi:
  source: geoboundaries
  iso3: CHE
  admin_level: 0             # whole country. For a faster first run set
  admin_name: null           # admin_level: 1 + admin_name: <canton>.

overture:
  release: "2026-06-17.0"

osm:
  source: overture           # no rate limits — preferred for training labels
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 500     # >=500 m2 rooftop solar arrays count as positives
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 0.5
  timeout_s: 300

imagery:
  stac_source: planetary_computer   # per-scene S2 L2A, no auth (anonymous SAS signing)
  collection: sentinel-2-l2a
  date_ranges:
    - ["2025-04-01", "2025-09-30"]   # scene search window
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 500  # >=500 m2 buildings define the inference ROIs

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 2
  neg_ratio: 0.5

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10
  min_solar_area_m2: 500

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
