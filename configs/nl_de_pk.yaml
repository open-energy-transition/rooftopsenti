# Multi-region training: Netherlands (primary) + Germany + Pakistan chips.
#
# Prerequisites — chips must exist for every region in model.train_regions:
#   rooftopsenti chips -c configs/germany.yaml     # runs aoi/labels/composite/buildings first
#   rooftopsenti chips -c configs/pakistan.yaml
#
# Train/val pools chips from all three regions (each keeps its own spatial
# split); test metrics are computed on the primary region (NL) only.
#
# Note on Pakistan: OSM solar mapping there is sparse, so it contributes few
# positives and its hard negatives are noisy (unmapped solar). It mainly adds
# negative-domain diversity (different roofs/landscape) for the M4 transfer —
# watch the NL test metrics to confirm it does not hurt.
region: netherlands

aoi:
  source: geoboundaries
  iso3: NLD
  admin_level: 0
  admin_name: null

overture:
  release: "2026-05-20.0"

osm:
  source: overture
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 1000
  rooftop_rule: intersect_or_roof_tag
  chunk_deg: 0.5
  timeout_s: 300

imagery:
  stac_source: earthgenome
  collection: sentinel2-temporal-mosaics
  date_ranges:
    - ["2023-04-01", "2023-09-30"]
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median
  cloud_mask: scl
  target_resolution_m: 10
  tiles: null

buildings:
  building_area_min_m2: 1000

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco
  train_regions: [germany, pakistan]   # merged into train/val; NL-only test
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4
  neg_ratio: 5

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10
  min_solar_area_m2: 1000

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
