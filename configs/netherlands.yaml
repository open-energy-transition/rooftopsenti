# Pilot region: Netherlands (well-mapped OSM rooftop solar — used for training + inference)
region: netherlands

aoi:
  source: geoboundaries      # geoboundaries | overpass_admin | bbox
  iso3: NLD
  admin_level: 0             # 0 = country, 1 = state/province
  admin_name: null           # set together with admin_level: 1 for a single province

overture:
  release: "2026-06-17.0"

osm:
  source: overture           # overture (default, no rate limits) | overpass (live OSM)
  overpass_url: https://overpass-api.de/api/interpreter
  solar_area_min_m2: 1000    # ~10 Sentinel-2 pixels
  rooftop_rule: intersect_or_roof_tag   # roof tag OR intersects a building polygon
  chunk_deg: 0.5             # bbox grid size for chunked Overpass queries
  timeout_s: 300

imagery:
  # planetary_computer: Microsoft-hosted Sentinel-2 L2A scenes, 10 m native, all
  # bands, anonymous SAS signing (no keys). Scenes in the date range are
  # cloud-masked (SCL) and median-composited per tile. Alternatives: earthgenome
  # (pre-composited yearly mosaics, ~12 m) | cdse_mosaics (4 bands + S3 keys) |
  # earth_search.
  stac_source: planetary_computer
  collection: sentinel-2-l2a
  date_ranges:
    - ["2025-04-01", "2025-09-30"]   # scene search window
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  composite_method: median   # median | medoid (via S2Mosaic)
  cloud_mask: scl            # scl | omnicloudmask (unused for pre-composited sources)
  target_resolution_m: 10
  tiles: null                # optional MGRS whitelist; null = all tiles intersecting AOI

buildings:
  building_area_min_m2: 1000

model:
  arch: unet
  encoder: resnet18
  pretrained: ssl4eo_s2_moco # SSL4EO-S12 Sentinel-2 MoCo weights via torchgeo
  train_regions: []          # extra regions' chips to merge in — see configs/nl_de_pk.yaml
  num_classes: 2
  loss: focal_dice
  lr: 1.0e-4
  batch_size: 32
  patch_size: 256
  max_epochs: 60
  device: auto

chips:
  pos_per_label: 4           # jittered patches per positive polygon
  neg_ratio: 1               # hard-negative : positive patch ratio

postprocess:
  prob_threshold: 0.5
  building_coverage_min: 0.10  # predicted-solar fraction of footprint => has_solar
  min_solar_area_m2: 1000

split:
  block_size_km: 25
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 42
